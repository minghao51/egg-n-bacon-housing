<text x="1080" y="342" font-size="12" class="label" style="fill:#B64426">HOW TO READ THIS</text>
<text x="1080" y="382" font-size="21" class="serif">A median is the midpoint</text>
<text x="1080" y="411" font-size="21" class="serif">of ordered sale prices;</text>
<text x="1080" y="440" font-size="21" class="serif">not a listing quote.</text>
<text x="1080" y="497" font-size="16" class="">With an even sample,</text>
<text x="1080" y="523" font-size="16" class="">average the two central prices.</text>
<text x="1080" y="549" font-size="16" class="">Source coverage also varies;</text>
<text x="1080" y="575" font-size="16" class="">check dates before comparing.</text>
<text x="1080" y="635" font-size="15" class="bold">Check coverage before</text>
<text x="1080" y="659" font-size="15" class="bold">comparing long-run trends.</text>
<text x="1080" y="707" font-size="15" class="bold" style="fill:#006B65">Read data notes →</text>

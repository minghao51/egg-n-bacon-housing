<text x="72" y="908" font-size="14" class="">Unit review required: one source table labels a per-square-metre statistic as “Median PSF”.</text>
<text x="72" y="932" font-size="14" class="">Do not redraw that table into a PSF chart until units and discount arithmetic are reconciled.</text>
<text x="56" y="1011" font-size="27" class="serif">Read the finding and the method together.</text>
<text x="56" y="1051" font-size="18" class="">This existing study describes non-linear price profiles across lease bands.</text>
<text x="56" y="1082" font-size="18" class="">Treat its claims as published research—not an individual-flat valuation.</text>
<text x="56" y="1113" font-size="18" class="">Keep observed table values, model-adjusted effects and recommendations separate.</text>
<text x="56" y="1181" font-size="20" class="bold">Method disclosure / expanded</text>
<text x="56" y="1219" font-size="16" class="">Grouping: remaining-lease bands; town comparisons use a different slice.</text>
<text x="56" y="1248" font-size="16" class="">Inspect nominal currency, sqm vs sq ft, baseline and cohort counts before charting.</text>
<text x="56" y="1277" font-size="16" class="">Retired generator paths are not a reproducibility guarantee. Keep the source note visible.</text>

<text x="56" y="802" font-size="13" class="label">THREE JOURNEYS</text>
<text x="56" y="845" font-size="18" class="">01  Understand the market → Overview → choose HDB → Explore → Tampines → read caveats.</text>
<text x="56" y="885" font-size="18" class="">02  Compare places → Explore → set year/type → sort price or PSF → inspect sales counts → open area.</text>
<text x="56" y="925" font-size="18" class="">03  Audit a claim → Research → report method → Data &amp; methods → catalog schema / pipeline lineage.</text>
<line x1="56" y1="972" x2="1384" y2="972" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="1010" font-size="12" class="label" style="fill:#B64426">MIGRATION / RETAIN THE DEEP LINKS</text>
<text x="56" y="1044" font-size="16" class="">/dashboard → overview; /dashboard/leaderboard → explorer. Preserve legacy /dashboard/map metrics and layer state.</text>
<text x="56" y="1073" font-size="16" class="">Research subnavigation: Studies / Trends / Segments / Tools / Research map. Add aliases; do not erase old query state.</text>
<text x="56" y="1102" font-size="16" class="">Keep /analytics/* and /catalog/* stable. With static hosting, provide base-aware redirect/link pages and test bookmarks.</text>

<text x="56" y="240" font-size="48" class="serif">The middle sale was S$710,000.</text>
<text x="56" y="282" font-size="19" class="muted">Tampines · HDB resale · Jan–Dec 2025 · 1,921 observed transactions</text>
<line x1="56" y1="313" x2="1384" y2="313" stroke="#CDD2CA" stroke-width="1"/>
<g id="area-comparison">
<text x="56" y="359" font-size="27" class="bold">Above the national median. Not a like-for-like premium.</text>
<text x="56" y="397" font-size="18" class="">Tampines’ median was S$82,000 higher than the national HDB median in 2025.</text>
<text x="56" y="426" font-size="18" class="">This 13.1% difference may reflect the homes sold, not location alone.</text>
<text x="56" y="452" font-size="12" class="muted">Reconciled design snapshot. National includes 2 Sungei Kadut sales excluded from the area map; production baseline is release-gated.</text>

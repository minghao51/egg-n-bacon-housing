<rect x="56" y="887" width="1328" height="67" rx="3" fill="#F8E8CC"/>
<text x="76" y="914" font-size="12" class="label">SOURCE FRESHNESS IS NOT FULLY RECORDED</text>
<text x="76" y="939" font-size="15" class="">Do not infer market completeness from generation dates. Missing planning areas and model vintages affect comparability.</text>
</g>
<g id="definitions-and-lineage">
<text x="56" y="1002" font-size="25" class="serif">Definitions beside every claim</text>
<text x="56" y="1040" font-size="16" class="">Median: ordered-price midpoint; average two central values if even.</text>
<text x="56" y="1069" font-size="16" class="">Median PSF: median of each sale’s price / floor area in square feet.</text>
<text x="56" y="1098" font-size="16" class="">Sample: included transaction rows, not independent buyers or listings.</text>
<text x="56" y="1127" font-size="16" class="">150-sale display rule: proposed caution threshold, not a confidence test.</text>
<text x="786" y="1002" font-size="25" class="serif">Trace the published data</text>
<text x="786" y="1040" font-size="16" class="">Government / manual sources → bronze → silver</text>
<text x="786" y="1069" font-size="16" class="">→ gold features → platinum → maintenance export</text>
<text x="786" y="1098" font-size="16" class="">→ compressed app assets → static pages / React islands</text>
<text x="786" y="1164" font-size="16" class="bold" style="fill:#006B65">Open data catalog →</text>
</g>
<text x="56" y="1239" font-size="15" class="muted">Before publishing research: audit units, model dates, synthetic yield fallbacks and reproducibility. See the handoff.</text>

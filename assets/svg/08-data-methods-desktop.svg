<text x="530" y="579" font-size="16" class="">2025 · 31 HDB planning areas</text>
<text x="958" y="579" font-size="16" class="">Timestamp not embedded</text>
<text x="958" y="607" font-size="14" class="bold" style="fill:#006B65">Observed aggregate</text>

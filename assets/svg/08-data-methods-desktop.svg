<text x="56" y="126" font-size="12" class="label" style="fill:#B64426">DATA &amp; METHODS / PROPOSED GUIDE</text>
<text x="56" y="182" font-size="48" class="serif">Know what you’re comparing.</text>
<text x="56" y="219" font-size="18" class="muted">Observed transactions, derived indicators and research models are different kinds of evidence.</text>
<rect x="56" y="247" width="176" height="25" rx="2" fill="#F8E8CC"/>
<text x="65" y="264" font-size="11" class="bold" style="fill:#172E33">New provenance guide</text>
<text x="256" y="265" font-size="15" class="muted">Existing assets; proposed cross-asset metadata contract</text>
<line x1="56" y1="292" x2="1384" y2="292" stroke="#CDD2CA" stroke-width="1"/>
<g id="evidence-ledger">
<text x="56" y="338" font-size="28" class="serif">Three clocks, not one “last updated”.</text>
<text x="56" y="375" font-size="17" class="muted">Export time describes a file. Coverage describes included observations. Source freshness needs its own record.</text>
<text x="56" y="425" font-size="12" class="label">EVIDENCE</text>
<text x="530" y="425" font-size="12" class="label">OBSERVATIONS / COVERAGE</text>
<text x="958" y="425" font-size="12" class="label">EXPORT / STATUS</text>
<line x1="56" y1="451" x2="1384" y2="451" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="478" font-size="19" class="bold">Annual national comparison</text>
<text x="56" y="506" font-size="14" class="muted">dashboard_overview · price medians</text>
<text x="530" y="478" font-size="16" class="">2025 · 78,796 transactions</text>
<text x="958" y="478" font-size="16" class="">24 Oct 2026</text>

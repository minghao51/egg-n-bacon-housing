<text x="555" y="1125" font-size="14" class="muted">Zero baseline for bars · no fabricated confidence bands.</text>
<text x="555" y="1153" font-size="14" class="muted">Nulls break lines. Show data table, source, period and sample.</text>
</g>
<line x1="56" y1="1200" x2="1384" y2="1200" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="1240" font-size="13" class="label">06 / IMPLEMENTATION RULE</text>
<text x="56" y="1274" font-size="16" class="">These SVGs are specifications, not the rendering architecture. Build navigation, forms, tables and disclosures as semantic HTML.</text>
<text x="56" y="1304" font-size="16" class="">Use React/Recharts for interactive plots; Leaflet only when Map is chosen. Provide a textual summary and accessible table for every chart.</text>
<text x="56" y="1334" font-size="16" class="">Color contrast: all normal text pairs ≥ 4.5:1; chart fills against paper ≥ 3:1. Do not use pale rules as control boundaries without context.</text>
</svg>
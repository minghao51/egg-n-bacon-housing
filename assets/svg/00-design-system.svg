<text x="865" y="623" font-size="16" class="">Desktop: 1,440 frame / 56 gutters / 24 gaps.</text>
<text x="865" y="653" font-size="16" class="">12 columns within 1,328 px content width.</text>
<text x="865" y="683" font-size="16" class="">Mobile: 390 frame / 20 gutters / 16 gaps.</text>
<text x="865" y="713" font-size="16" class="">Text column: 60–75 characters maximum.</text>
<text x="865" y="743" font-size="16" class="">Borders 1 px · radius 4 px · no ornamental shadows.</text>

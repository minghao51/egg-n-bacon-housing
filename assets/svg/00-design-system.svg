<g id="typography">
<text x="56" y="500" font-size="13" class="label">02 / TYPOGRAPHY</text>
<text x="56" y="556" font-size="40" class="serif">What does a home cost here?</text>
<text x="56" y="597" font-size="14" class="muted">Georgia / 48 desktop · 34 mobile · regular</text>
<text x="56" y="644" font-size="24" class="bold">Compare the same market, not mixed periods.</text>
<text x="56" y="680" font-size="16" class="">Arial / 24 section · 18 body · 14 labels · 12 source minimum</text>
<text x="56" y="720" font-size="25" class="bold num">S$710,000     1,921 sales     +13.1%</text>
<text x="56" y="751" font-size="14" class="muted">Tabular numerals; full currency on first reference. PSF = S$ per sq ft.</text>
<text x="56" y="775" font-size="13" class="muted">13.1% is a median-level difference, not annual growth.</text>
</g>

<text x="56" y="126" font-size="12" class="label" style="fill:#B64426">VISUAL SPECIFICATION / 00</text>
<text x="56" y="182" font-size="48" class="serif">Fieldnotes for a housing market</text>
<text x="56" y="219" font-size="18" class="muted">Warm paper. Sharp questions. Evidence before recommendations. Original identity; no FiveThirtyEight branding.</text>

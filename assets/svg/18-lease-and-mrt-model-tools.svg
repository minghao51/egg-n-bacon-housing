<g id="transport-tool">
<text x="746" y="337" font-size="32" class="serif">MRT / CBD</text>
<text x="746" y="385" font-size="13" class="bold">Property type</text>
<rect x="746" y="398" width="290" height="46" rx="4" fill="#FFFEFA" stroke="#7A8583"/>
<text x="759" y="427" font-size="16" class="num">HDB ▾</text>
<text x="1058" y="385" font-size="13" class="bold">Canonical area key</text>
<rect x="1058" y="398" width="326" height="46" rx="4" fill="#FFFEFA" stroke="#7A8583"/>
<text x="1071" y="427" font-size="16" class="num">BISHAN ▾</text>
<text x="746" y="484" font-size="13" class="bold">Distance to MRT / metres</text>
<rect x="746" y="497" width="290" height="46" rx="4" fill="#FFFEFA" stroke="#7A8583"/>
<text x="759" y="526" font-size="16" class="num">500</text>
<text x="1058" y="484" font-size="13" class="bold">Distance to CBD / km</text>
<rect x="1058" y="497" width="326" height="46" rx="4" fill="#FFFEFA" stroke="#7A8583"/>
<text x="1071" y="526" font-size="16" class="num">10</text>
<text x="746" y="584" font-size="13" class="bold">Floor area / square feet · proposed explicit input</text>
<rect x="746" y="597" width="638" height="46" rx="4" fill="#FFFEFA" stroke="#7A8583"/>
<text x="759" y="626" font-size="16" class="num">1,000</text>
<rect x="746" y="700" width="638" height="126" rx="4" fill="#F8E8CC"/>
<text x="762" y="727" font-size="14" class="">MODEL REVIEW REQUIRED</text>
<text x="762" y="751" font-size="14" class="">The current formula increases “premium” with distance,</text>
<text x="762" y="775" font-size="14" class="">then stops changing above 500m. Its ×1,000 is an</text>
<text x="762" y="799" font-size="14" class="">implicit floor-area assumption. Total-dollar output is withheld.</text>
<text x="746" y="898" font-size="22" class="serif">Preserve the controls. Correct the model contract.</text>
<text x="746" y="940" font-size="16" class="">Normalize town keys; default “Bishan” differs from “BISHAN”.</text>
<text x="746" y="971" font-size="16" class="">Declare whether distance is proximity or change in distance.</text>
<text x="746" y="1002" font-size="16" class="">Use explicit S$/sq ft/100m coefficients and floor area.</text>
<text x="746" y="1033" font-size="16" class="">Do not carry 7× / 15× prose into the redesigned calculator.</text>
<rect x="746" y="1101" width="638" height="44" rx="4" fill="#FFFEFA" stroke="#7A8583"/>
<text x="760" y="1128" font-size="14" class="" style="fill:#172E33">Open transport methodology &amp; audit notes →</text>
</g>
<line x1="56" y1="1202" x2="1384" y2="1202" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="1247" font-size="27" class="serif">Spatial-pattern tool / retained, but contract repair comes first</text>
<text x="56" y="1288" font-size="17" class="">Current asset supplies towns[], while the component expects clusters[]. Display an unavailable-state boundary until adapted.</text>
<text x="56" y="1320" font-size="17" class="">Reconstruct labels only from validated fields. Do not compound a five-year or undefined-period number as an annual rate.</text>
<text x="56" y="1352" font-size="17" class="">Keep portfolio allocation and BUY/SELL prompts out of the redesigned tool until they have an independently reviewed basis.</text>
<line x1="56" y1="1430" x2="1384" y2="1430" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="1458" font-size="13" class="muted">Sources: interactive_tools lease/MRT/spatial assets + existing components · P: model gates and corrected unit semantics</text>
<text x="1210" y="1458" font-size="13" class="bold" style="fill:#006B65">Data &amp; methods →</text>

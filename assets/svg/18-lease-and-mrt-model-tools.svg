<text x="72" y="1012" font-size="14" class="">Lookup, not a fitted decay curve. Use non-overlapping bins.</text>
<text x="72" y="1036" font-size="14" class="">At shared endpoints the existing first-match rule is ambiguous.</text>
<text x="72" y="1060" font-size="14" class="">The stored risk labels conflict with the insight prose; withhold</text>
<text x="72" y="1084" font-size="14" class="">“safe/cliff” recommendations until the source is reconciled.</text>
</g>

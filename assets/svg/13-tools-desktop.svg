<text x="1136" y="521" font-size="14" class="">Not a loan offer.</text>
<text x="1136" y="545" font-size="14" class="">Not an eligibility check.</text>
<text x="1136" y="569" font-size="14" class="">Excludes fees, insurance,</text>
<text x="1136" y="593" font-size="14" class="">taxes and grants.</text>
<text x="1136" y="617" font-size="14" class="">No CPF / TDSR / MSR</text>
<text x="1136" y="641" font-size="14" class="">determination is made.</text>
<line x1="56" y1="1070" x2="1384" y2="1070" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="1116" font-size="27" class="serif">Three research tools remain distinct.</text>
<text x="56" y="1164" font-size="23" class="serif">Lease bands</text>
<text x="56" y="1204" font-size="15" class="muted">Input: remaining years (40–99).</text>
<text x="56" y="1231" font-size="15" class="muted">At 75: stored 74–79-year band.</text>
<text x="56" y="1258" font-size="15" class="muted">19.1% band statistic; not a price forecast.</text>
<text x="56" y="1285" font-size="15" class="muted">Resolve overlapping bin endpoints.</text>
<text x="56" y="1341" font-size="15" class="bold" style="fill:#006B65">Open tool &amp; assumptions →</text>
<text x="506" y="1164" font-size="23" class="serif">MRT / CBD</text>
<text x="506" y="1204" font-size="15" class="muted">Inputs: type, town, MRT m, CBD km.</text>
<text x="506" y="1231" font-size="15" class="muted">Units and distance direction conflict</text>
<text x="506" y="1258" font-size="15" class="muted">in current formulas. Keep outputs</text>
<text x="506" y="1285" font-size="15" class="muted">in an audit-gated model archive.</text>
<text x="506" y="1341" font-size="15" class="bold" style="fill:#006B65">Open tool &amp; assumptions →</text>
<text x="956" y="1164" font-size="23" class="serif">Spatial patterns</text>
<text x="956" y="1204" font-size="15" class="muted">Filter: cluster class and persistence.</text>
<text x="956" y="1231" font-size="15" class="muted">Show stored town labels, sample/date</text>
<text x="956" y="1258" font-size="15" class="muted">unknowns and method. No portfolio</text>
<text x="956" y="1285" font-size="15" class="muted">allocation or BUY/SELL guidance.</text>
<text x="956" y="1341" font-size="15" class="bold" style="fill:#006B65">Open tool &amp; assumptions →</text>
<text x="56" y="1428" font-size="15" class="muted">P: editable financing assumptions and aligned 2025 price. Existing calculator default is 30% down, 25 years, 3%.</text>
<line x1="56" y1="1480" x2="1384" y2="1480" stroke="#CDD2CA" stroke-width="1"/>
<text x="56" y="1508" font-size="13" class="muted">Actual 2025 reference price + illustrative inputs · standard amortization, no financial recommendation</text>
<text x="1210" y="1508" font-size="13" class="bold" style="fill:#006B65">Data &amp; methods →</text>

# Reviewed security-audit exception register (REL-4).
#
# Two CI jobs in `.github/workflows/ci.yml` read this file: `audit-python` (pip-audit
# against a frozen, all-groups export of `uv.lock`, no install) and `audit-frontend`
# (`bun audit` in `app/`). Both jobs FAIL when an advisory is not listed here, and
# FAIL when a listed entry is past its `expires` date and still suppresses a live
# finding. An advisory is therefore never ignored silently: every accepted one is
# named, justified and owned.
#
# Rules for editing this file (see docs/guides/ci-cd-pipeline.md, "Dependency
# vulnerability triage"):
#
#   1. Fix first. An exception is for an advisory that CANNOT be closed by a change
#      this repository is willing to make now, not for one nobody has looked at.
#   2. Every entry names the exact advisory ids it accepts. There is no
#      package-level or severity-level switch: a new advisory on an already-listed
#      package still fails the build until it is added and reviewed.
#   3. `expires` is a hard date, not a reminder. When it passes, the job fails.
#      Extend it only with a fresh reachability assessment; delete the entry as
#      soon as the fix lands (an entry that no longer matches anything is reported
#      as stale, so leftover entries are visible without reddening the build).
#   4. `owner_role` is the role accountable for the next review, not a person.
#   5. Rationale states why the advisory is not reachable in this repository, or
#      why the fix is deferred. "Low severity" alone is not a rationale.
#
# Baseline evidence: `master-audit-2026-11-23`. Raw records are NOT unique CVEs --
# the audits emit duplicate and alias representations of the same advisory (for
# example a PYSEC id plus its GHSA alias, or one GHSA listed once per affected
# major range). This file is keyed by the canonical advisory id (GHSA where one
# exists) and deduplicated per package, which is why the entry count is smaller
# than the raw record count.

schema_version: 1
updated: "2026-11-24"
baseline: "master-audit-2026-11-23"
#
# 2026-11-24: sixteen `app-bun` entries were deleted after the DOMPurify 3.5.0
# and Astro 7.4.13 upgrades (plus a semver-range `bun update`) closed their
# advisories. Frontend scope went from 110 raw records / 24 names to 28 / 8.
# Nothing was widened and no rationale was rewritten: a closed advisory loses
# its entry. Re-derive the current counts with the commands in
# docs/guides/ci-cd-pipeline.md before editing.

scopes:
  python-all-groups:
    tool: pip-audit
    job: audit-python  # .github/workflows/ci.yml
    export: uv export --frozen --all-groups --all-extras --no-emit-project
    owner_role: platform-engineer
    review_cadence: quarterly
    description: >-
      Every dependency group and extra in `uv.lock` (dev, research, tracking),
      audited from a frozen requirements export with no installation. The
      CI-parity `security` job keeps auditing only the dev environment, where
      the count is zero; this scope is where the research stack is visible.
  app-bun:
    tool: bun-audit
    job: audit-frontend  # .github/workflows/ci.yml
    export: bun audit --json (app/bun.lock, after bun install --frozen-lockfile)
    owner_role: frontend-engineer
    review_cadence: quarterly
    description: >-
      The Astro frontend dependency graph, runtime and build-time alike. Runtime
      advisories ship to browsers; build-time advisories are local-trust only,
      which the per-package rationale states explicitly.


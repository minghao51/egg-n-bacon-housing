# Pre-commit hooks for egg-n-bacon-housing

exclude: |
  (?x)^(
    data/|
    app/public/data/|
    app/.astro-cache/|
    htmlcov/|
    output/|
    node_modules/|
    \.venv/|
    src/egg_n_bacon_housing\.egg-info/
  )

repos:
  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: \.devcontainer/
      - id: check-added-large-files
      - id: check-merge-conflict

  # Lockfile validation
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.14
    hooks:
      - id: uv-lock

  # Frontend formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.4
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]
        # Two trees are hash-pinned and must never be reformatted:
        # - docs/analytics/editions/ : signed text, pinned by `editionSha256` and
        #   re-hashed by the archive route at build time (the legacy tree is also
        #   pinned by the RF00 baseline manifest).
        # - docs/implementation/artifacts/ : canonical evidence ledgers written by
        #   scripts/tools/*.py with sort_keys + indent=2. Their sha256 IS the thing
        #   signatures attach to (`artifactSha256`), and `--check` re-measures the
        #   bytes, so a formatter touching them breaks a recorded approval.
        exclude: (bun\.lock|^docs/analytics/editions/|^docs/implementation/artifacts/)
        additional_dependencies:
          - prettier@3.4.2

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Canonical evidence ledgers are generated, hash-pinned JSON whose content is
        # sha256 digests by construction (asset identity, model inputs, quote checks).
        # Scanning them only produces line-number churn that silently invalidates a
        # signed `artifactSha256`-adjacent baseline; their integrity is enforced by the
        # producers' `--check` modes instead.
        #
        # `edition-registry.ts` is excluded for the same reason. It is the pinned
        # registry of those ledgers: every long literal in it is a sha256
        # (`editionSha256`, `artifactSha256`) or a ledger path. Re-pinning a ledger,
        # which a legitimate re-measurement requires, therefore adds new high-entropy
        # strings on every occasion and each one had to be hand-baselined — three
        # times in one branch. Its integrity is enforced by the evidence-pin test
        # (`app/tests/unit/edition-registry.test.ts`) and by the producers, not by
        # entropy heuristics.
        exclude: (package-lock\.json|pnpm-lock\.yaml|uv\.lock|^docs/implementation/artifacts/|^app/src/components/studies/lib/edition-registry\.ts$)

  # Local hooks (venv-dependent)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        pass_filenames: true
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --check
        language: system
        pass_filenames: true
        types: [python]

      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --skip-editable
        language: system
        pass_filenames: false
        stages: [manual]
